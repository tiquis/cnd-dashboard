[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cndpy"
version = "0.1.0"
description = "Compositional Nutrient Diagnosis (CND) core library: clr transforms, Cate-Nelson yield-cutoff detection, CND norms, and diagnostic indices."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rafael Magallanes-Quintanar" }]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "scipy>=1.7",
    "plotly>=5.0",
    "reportlab>=3.6",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.20"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cndpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
